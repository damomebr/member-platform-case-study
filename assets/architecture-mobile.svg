<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title"><title id="title">Plataforma de membros: fluxo conceitual em quatro etapas</title><g font-family="Avenir Next,Segoe UI,Arial,sans-serif"><rect width="720" height="1050" rx="20" fill="#F1F5FA"/><text x="36" y="62" font-size="28" font-weight="500" fill="#40536A">O fluxo em quatro etapas</text><rect x="36" y="104" width="648" height="180" rx="18" fill="white"/><text x="64" y="162" font-size="36" font-weight="600" fill="#77528C">Pedido</text><text x="64" y="214" font-size="30" font-weight="400" fill="#142A47">Aprovação ou conclusão</text><path d="M360 289V320M350 309L360 320L370 309" fill="none" stroke="#77528C" stroke-width="3"/><rect x="36" y="328" width="648" height="180" rx="18" fill="white"/><text x="64" y="386" font-size="36" font-weight="600" fill="#77528C">Vínculo</text><text x="64" y="438" font-size="30" font-weight="400" fill="#142A47">Cursos ligados ao produto</text><path d="M360 513V544M350 533L360 544L370 533" fill="none" stroke="#77528C" stroke-width="3"/><rect x="36" y="552" width="648" height="180" rx="18" fill="white"/><text x="64" y="610" font-size="36" font-weight="600" fill="#77528C">Matrícula</text><text x="64" y="662" font-size="30" font-weight="400" fill="#142A47">Registro de acesso</text><path d="M360 737V768M350 757L360 768L370 757" fill="none" stroke="#77528C" stroke-width="3"/><rect x="36" y="776" width="648" height="180" rx="18" fill="white"/><text x="64" y="834" font-size="36" font-weight="600" fill="#77528C">Portal</text><text x="64" y="886" font-size="30" font-weight="400" fill="#142A47">Conteúdo autorizado</text><text x="36" y="1020" font-size="23" font-weight="400" fill="#56677A">Visão conceitual do projeto.</text></g></svg>