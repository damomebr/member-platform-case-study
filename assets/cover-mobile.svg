<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">Plataforma de membros — Da compra ao conteúdo.</title><g font-family="Avenir Next,Segoe UI,Arial,sans-serif"><rect width="720" height="560" rx="20" fill="#F1F5FA"/><path d="M0 0H720V14H0Z" fill="#77528C"/><text x="48" y="75" font-size="24" font-weight="600" fill="#77528C">Plataforma de membros</text><text x="48" y="158" font-size="54" font-weight="600" fill="#142A47">Da compra ao</text><text x="48" y="225" font-size="54" font-weight="600" fill="#142A47">conteúdo.</text><text x="48" y="310" font-size="25" font-weight="400" fill="#40536A">Infraestrutura e acesso para entregar</text><text x="48" y="345" font-size="25" font-weight="400" fill="#40536A">produtos digitais.</text><text x="48" y="512" font-size="21" font-weight="500" fill="#77528C">Implantação &amp; controle de acesso</text></g></svg>