<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title"><title id="title">Plataforma de membros: fluxo conceitual</title><g font-family="Avenir Next,Segoe UI,Arial,sans-serif"><rect width="1080" height="580" rx="20" fill="#F1F5FA"/><text x="40" y="55" font-size="22" font-weight="500" fill="#40536A">O fluxo em quatro etapas</text><rect x="40" y="100" width="480" height="170" rx="16" fill="white"/><circle cx="72" cy="139" r="7" fill="#77528C"/><text x="95" y="148" font-size="29" font-weight="600" fill="#77528C">Pedido</text><text x="66" y="203" font-size="25" font-weight="400" fill="#142A47">Aprovação ou conclusão</text><rect x="560" y="100" width="480" height="170" rx="16" fill="white"/><circle cx="592" cy="139" r="7" fill="#77528C"/><text x="615" y="148" font-size="29" font-weight="600" fill="#77528C">Vínculo</text><text x="586" y="203" font-size="25" font-weight="400" fill="#142A47">Cursos ligados ao produto</text><rect x="40" y="335" width="480" height="170" rx="16" fill="white"/><circle cx="72" cy="374" r="7" fill="#77528C"/><text x="95" y="383" font-size="29" font-weight="600" fill="#77528C">Matrícula</text><text x="66" y="438" font-size="25" font-weight="400" fill="#142A47">Registro de acesso</text><rect x="560" y="335" width="480" height="170" rx="16" fill="white"/><circle cx="592" cy="374" r="7" fill="#77528C"/><text x="615" y="383" font-size="29" font-weight="600" fill="#77528C">Portal</text><text x="586" y="438" font-size="25" font-weight="400" fill="#142A47">Conteúdo autorizado</text><path d="M521 185H550M540 176L550 185L540 194 M800 275V307H280V328M271 318L280 328L289 318 M521 420H550M540 411L550 420L540 429" fill="none" stroke="#77528C" stroke-width="3"/><text x="40" y="548" font-size="19" font-weight="400" fill="#56677A">Visão conceitual baseada na documentação do projeto.</text></g></svg>